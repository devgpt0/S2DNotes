<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flatten array demo</title>
    <link rel="stylesheet" href="../styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Flatten a nested array</h1>
      <p>Input:</p>
      <pre>[1, [2, [3, 4]], 5]</pre>
      <button id="run" type="button">Run flatten</button>
      <p>Output:</p>
      <pre id="result" aria-live="polite">Press Run flatten</pre>
    </main>
  </body>
</html>
