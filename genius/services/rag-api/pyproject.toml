[project]
name = "genius-rag-api"
version = "0.1.0"
description = "Local-first RAG API for Genius Learning"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "numpy>=1.26,<3",
    "faiss-cpu>=1.8,<2",
    "rank-bm25>=0.2.2,<1",
    "FlagEmbedding>=1.3,<2",
    "sentence-transformers>=3,<4",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
    "pyright>=1.1,<2",
    "bandit>=1.8,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]

[tool.ruff]
target-version = "py312"

[tool.pyright]
include = ["app", "tests"]
extraPaths = ["../.."]
pythonVersion = "3.12"
typeCheckingMode = "standard"
